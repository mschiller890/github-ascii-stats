name: Update GitHub Stats

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs
        run: node scripts/index.mjs
        env:
          # Personal access token with `read:user` scope (classic) so the
          # GraphQL contributionsCollection query works. The default
          # GITHUB_TOKEN does not have this scope. Add it as a repo secret
          # named GH_STATS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh github stats [skip ci]"
          git push
